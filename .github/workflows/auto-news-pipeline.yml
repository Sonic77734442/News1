name: Auto News Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight env check
        shell: bash
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
        run: |
          set -euo pipefail
          missing=0
          for key in SANITY_API_TOKEN SANITY_DATASET; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ -n "${SANITY_DATASET:-}" ]; then
            if ! [[ "$SANITY_DATASET" =~ ^~?[a-z0-9_-]{1,64}$ ]]; then
              echo "::error::Invalid SANITY_DATASET format. Use something like production"
              missing=1
            fi
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Generate news from trends
        shell: bash
        run: |
          export AUTO_PUBLISH="${AUTO_PUBLISH:-1}"
          export AUTO_PUSH_SOCIAL="${AUTO_PUSH_SOCIAL:-0}"
          npm run content:trends:drafts
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TRENDS_GEO: ${{ vars.TRENDS_GEO }}
          TRENDS_MAX_ITEMS: ${{ vars.TRENDS_MAX_ITEMS }}
          AUTO_CONTENT_AUTHOR_NAME: ${{ vars.AUTO_CONTENT_AUTHOR_NAME }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          AUTO_PUSH_SOCIAL: ${{ vars.AUTO_PUSH_SOCIAL }}
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
