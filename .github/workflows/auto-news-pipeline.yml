name: Auto News Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * *'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate news from trends
        run: npm run content:trends:drafts
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TRENDS_GEO: ${{ vars.TRENDS_GEO }}
          TRENDS_MAX_ITEMS: ${{ vars.TRENDS_MAX_ITEMS }}
          AUTO_CONTENT_AUTHOR_NAME: ${{ vars.AUTO_CONTENT_AUTHOR_NAME }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          AUTO_PUSH_SOCIAL: ${{ vars.AUTO_PUSH_SOCIAL }}
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
